<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>מי המתחזה? 🕵️</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕵️</text></svg>">
<style>
  :root {
    --bg: #1d1b4b; --bg2: #2b2870; --card: #ffffff; --ink: #1d1b4b;
    --yellow: #ffd23f; --pink: #ff5d8f; --green: #3ddc97; --blue: #4cc9f0; --muted: #8b88c9;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Rubik", "Assistant", "Segoe UI", Arial, sans-serif;
    background: radial-gradient(circle at 20% 0%, var(--bg2), var(--bg) 70%);
    color: #fff; min-height: 100vh; display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 480px; padding: 20px 16px 40px; }
  h1 { font-size: 2.2rem; text-align: center; margin: 8px 0 4px; letter-spacing: .5px; }
  h1 span { color: var(--yellow); }
  .sub { text-align: center; color: var(--muted); margin: 0 0 20px; }
  h2 { font-size: 1.4rem; margin: 0 0 12px; }
  .panel { background: rgba(255,255,255,.08); border-radius: 22px; padding: 18px; margin-bottom: 16px; }
  input[type=text] {
    width: 100%; font-size: 1.4rem; padding: 14px 16px; border-radius: 16px; border: 3px solid transparent;
    outline: none; font-family: inherit; text-align: center; color: var(--ink);
  }
  input[type=text]:focus { border-color: var(--yellow); }
  button {
    font-family: inherit; font-size: 1.25rem; font-weight: 700; border: 0; border-radius: 18px;
    padding: 16px; width: 100%; cursor: pointer; margin-top: 12px; color: var(--ink);
    background: var(--yellow); box-shadow: 0 5px 0 #c9a21f; transition: transform .08s;
  }
  button:active { transform: translateY(4px); box-shadow: 0 1px 0 #c9a21f; }
  button:disabled { opacity: .45; }
  button.pink { background: var(--pink); color: #fff; box-shadow: 0 5px 0 #b83a63; }
  button.green { background: var(--green); box-shadow: 0 5px 0 #26a16d; }
  button.ghost { background: transparent; color: var(--muted); box-shadow: none; font-size: 1rem; padding: 10px; }
  .players { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
  .players li {
    background: rgba(255,255,255,.1); border-radius: 14px; padding: 10px 14px; display: flex;
    align-items: center; gap: 10px; font-size: 1.15rem;
  }
  .players li .av { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 1.1rem; font-weight: 700; color: var(--ink); flex: none; }
  .players li .nm { flex: 1; }
  .players li .tag { font-size: .8rem; background: var(--yellow); color: var(--ink); padding: 2px 8px; border-radius: 10px; }
  .players li .off { opacity: .4; }
  .players li .x { background: none; border: 0; color: var(--muted); font-size: 1.2rem; width: auto; padding: 4px 8px; margin: 0; box-shadow: none; }
  .row { display: flex; gap: 10px; align-items: center; justify-content: space-between; margin: 10px 0; font-size: 1.05rem; }
  .row select, .seg button { font-family: inherit; font-size: 1rem; }
  select { padding: 8px 10px; border-radius: 12px; border: 0; color: var(--ink); max-width: 55%; }
  .seg { display: flex; gap: 6px; }
  .seg button { margin: 0; padding: 8px 14px; width: auto; box-shadow: none; background: rgba(255,255,255,.15); color: #fff; }
  .seg button.on { background: var(--yellow); color: var(--ink); }
  .err { background: var(--pink); color: #fff; padding: 10px 14px; border-radius: 14px; margin-bottom: 12px; text-align: center; }
  .note { color: var(--muted); text-align: center; font-size: .95rem; margin-top: 10px; }
  .big { font-size: 1.2rem; text-align: center; }

  /* קלף */
  .cardwrap { perspective: 1000px; margin: 10px auto 6px; width: 100%; max-width: 340px; aspect-ratio: 3/4; }
  .flip { position: relative; width: 100%; height: 100%; transition: transform .5s; transform-style: preserve-3d; cursor: pointer; }
  .flip.open { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0; backface-visibility: hidden; border-radius: 26px; display: flex;
    flex-direction: column; align-items: center; justify-content: center; padding: 20px; text-align: center;
  }
  .front { background: repeating-linear-gradient(45deg, var(--blue), var(--blue) 18px, #3ab4dc 18px, #3ab4dc 36px); color: var(--ink); }
  .front .q { font-size: 6rem; }
  .front p { font-size: 1.3rem; font-weight: 700; background: rgba(255,255,255,.85); padding: 8px 16px; border-radius: 14px; }
  .back { background: var(--card); color: var(--ink); transform: rotateY(180deg); }
  .back.imp { background: var(--pink); color: #fff; }
  .back .lbl { font-size: 1.1rem; opacity: .7; }
  .back .word { font-size: 3rem; font-weight: 800; margin: 10px 0; line-height: 1.1; }
  .back .emoji { font-size: 4.5rem; }
  .back .cat { font-size: 1.1rem; background: rgba(0,0,0,.08); padding: 6px 14px; border-radius: 12px; }

  .progress { height: 12px; background: rgba(255,255,255,.12); border-radius: 8px; overflow: hidden; margin: 10px 0; }
  .progress div { height: 100%; background: var(--green); transition: width .3s; }
  .vote-list { display: grid; gap: 10px; }
  .vote-list button { margin: 0; background: rgba(255,255,255,.12); color: #fff; box-shadow: none; text-align: right; display: flex; align-items: center; gap: 10px; }
  .vote-list button.sel { background: var(--yellow); color: var(--ink); }
  .banner { font-size: 1.8rem; font-weight: 800; text-align: center; padding: 18px; border-radius: 22px; margin-bottom: 14px; }
  .banner.win { background: var(--green); color: var(--ink); }
  .banner.lose { background: var(--pink); }
  .reveal-word { text-align: center; font-size: 1.2rem; }
  .reveal-word b { font-size: 2.2rem; display: block; color: var(--yellow); }
  .tally li .v { font-weight: 800; }
  .tips { margin: 0; padding-inline-start: 22px; line-height: 1.7; }
  .starter { background: var(--yellow); color: var(--ink); border-radius: 18px; padding: 14px; text-align: center; font-size: 1.2rem; margin-bottom: 14px; }
  .starter b { font-size: 1.5rem; }
  .url { direction: ltr; text-align: center; font-weight: 700; color: var(--yellow); font-size: 1.15rem; word-break: break-all; }
  .code { font-size: 3.4rem; font-weight: 800; letter-spacing: 10px; color: var(--yellow); direction: ltr; }
  .qr { background: #fff; border-radius: 16px; padding: 8px; width: 190px; margin: 8px auto; }
  .qr svg { width: 100%; height: auto; display: block; }
  summary { cursor: pointer; font-size: 1.1rem; }
</style>
</head>
<body>
<main id="app"><h1>מי <span>המתחזה</span>? 🕵️</h1><p class="sub">טוען…</p></main>
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="game.js"></script>
</body>
</html>
