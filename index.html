<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="מי המתחזה? – משחק מסיבה בעברית לכל המשפחה, כל אחד בטלפון שלו. לגילאי 5–12.">
<meta name="theme-color" content="#1d1b4b">
<title>מי המתחזה? – משחק לכל המשפחה</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🕵️</text></svg>">
<style>
  /* צבעים נבדקו לניגודיות WCAG 2.2 AA: טקסט רגיל ≥ 4.5:1, טקסט גדול ורכיבים ≥ 3:1 */
  :root {
    --bg: #1d1b4b; --bg2: #2b2870; --panel: rgba(255,255,255,.08); --card: #ffffff; --ink: #1d1b4b;
    --yellow: #ffd23f; --pink: #ff5d8f; --pink-text: #ff9fbf; --green: #3ddc97; --blue: #4cc9f0;
    --muted: #c4c1f0; --focus: #ffffff;
    --r: 20px; --tap: 48px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 100%; -webkit-text-size-adjust: 100%; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Rubik", "Assistant", "Heebo", "Segoe UI", system-ui, Arial, sans-serif;
    background: radial-gradient(circle at 20% 0%, var(--bg2), var(--bg) 70%) fixed, var(--bg);
    color: #fff; line-height: 1.5; display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 30rem; padding: 1rem 1rem 2.5rem; }

  /* נגישות: טקסט לקוראי מסך בלבד ודילוג לתוכן */
  .sr-only { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
  .skip { position: absolute; top: -100px; right: 1rem; background: var(--yellow); color: var(--ink); padding: .75rem 1rem; border-radius: 12px; font-weight: 700; z-index: 10; }
  .skip:focus { top: 1rem; }

  /* מיקוד נראה תמיד (WCAG 2.4.7 / 2.4.11) */
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; box-shadow: 0 0 0 6px var(--bg); border-radius: 12px; }
  h1:focus { outline: none; }
  h1:focus-visible { outline: 3px solid var(--focus); }

  .top { display: flex; align-items: center; justify-content: space-between; gap: .5rem; margin: .25rem 0 .5rem; }
  h1 { font-size: 1.9rem; margin: 0; line-height: 1.2; }
  h1 .hl { color: var(--yellow); }
  .tool { padding: 0 .7rem; white-space: nowrap; min-width: var(--tap); min-height: var(--tap); border-radius: 14px; border: 2px solid var(--muted); background: transparent; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  .tool .big-a { font-size: 1.35em; }
  .sub { text-align: center; color: var(--muted); margin: 0 0 1rem; }
  h2 { font-size: 1.3rem; margin: 0 0 .75rem; line-height: 1.3; }
  h3 { font-size: 1.15rem; margin: 0 0 .5rem; }
  .panel { background: var(--panel); border-radius: var(--r); padding: 1rem 1.1rem; margin: 0 0 1rem; }
  .panel > :last-child { margin-bottom: 0; }
  .center { text-align: center; }
  .big { font-size: 1.15rem; text-align: center; }
  .note { color: var(--muted); text-align: center; font-size: .95rem; margin: .6rem 0 0; }

  .lbl { display: block; font-weight: 700; margin: .25rem 0 .4rem; }
  input[type=text], select {
    width: 100%; min-height: 3.25rem; font-size: 1.3rem; padding: .6rem 1rem; border-radius: 14px;
    border: 3px solid transparent; font-family: inherit; color: var(--ink); background: #fff;
  }
  input[type=text] { text-align: center; }
  select { font-size: 1.1rem; }
  input:focus-visible, select:focus-visible { border-color: var(--yellow); }
  input[aria-invalid="true"] { border-color: var(--pink); background: #fff0f5; }

  .btn {
    display: flex; align-items: center; justify-content: center; gap: .4rem;
    font-family: inherit; font-size: 1.2rem; font-weight: 700; border: 0; border-radius: 18px;
    min-height: 3.5rem; padding: .75rem 1rem; width: 100%; cursor: pointer; margin-top: .75rem; color: var(--ink);
    background: var(--yellow); box-shadow: 0 5px 0 #c9a21f; transition: transform .08s;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #c9a21f; }
  .btn[aria-disabled="true"] { opacity: .55; cursor: not-allowed; }
  .btn.pink { background: var(--pink); box-shadow: 0 5px 0 #b83a63; }
  .btn.green { background: var(--green); box-shadow: 0 5px 0 #26a16d; }
  .btn.blue { background: var(--blue); box-shadow: 0 5px 0 #2a8fb0; }
  .btn.light { background: #fff; box-shadow: 0 4px 0 #ccc; }
  .btn.ghost { background: transparent; color: #fff; box-shadow: none; border: 2px solid rgba(255,255,255,.35); font-size: 1.05rem; min-height: var(--tap); }
  .btn.small { font-size: 1.05rem; min-height: var(--tap); width: auto; padding: .5rem 1.2rem; margin: .5rem auto; }
  .btn.inline { display: inline-flex; }
  .row2 { display: flex; gap: .75rem; }
  .row2 .btn { flex: 1; }

  .players { list-style: none; padding: 0; margin: 0; display: grid; gap: .5rem; }
  .players li { background: rgba(255,255,255,.1); border-radius: 14px; padding: .5rem .9rem; display: flex; align-items: center; gap: .6rem; font-size: 1.1rem; min-height: var(--tap); }
  .av { width: 2.1rem; height: 2.1rem; border-radius: 50%; display: grid; place-items: center; font-weight: 700; color: var(--ink); flex: none; }
  .players .nm { flex: 1; }
  .players .off { opacity: .75; }
  .tag { font-size: .85rem; background: var(--yellow); color: var(--ink); padding: .1rem .55rem; border-radius: 10px; font-weight: 700; }
  .tag.pinktag { background: var(--pink); }
  .tagoff { font-size: .8rem; border: 1px solid var(--muted); color: var(--muted); padding: 0 .4rem; border-radius: 8px; }
  .x { min-width: var(--tap); min-height: var(--tap); background: none; border: 2px solid transparent; color: #fff; font-size: 1.2rem; cursor: pointer; border-radius: 12px; }

  fieldset.seg-field { border: 0; padding: 0; margin: 1rem 0 0; display: flex; justify-content: space-between; align-items: center; gap: .75rem; flex-wrap: wrap; }
  fieldset.seg-field legend { float: right; font-weight: 700; padding: 0; }
  .seg { display: flex; gap: .4rem; }
  .seg-opt { position: relative; }
  .seg-opt input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
  .seg-opt span { display: grid; place-items: center; min-width: 3.5rem; min-height: var(--tap); padding: 0 .9rem; border-radius: 12px;
    background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); font-weight: 700; }
  .seg-opt input:checked + span { background: var(--yellow); color: var(--ink); border-color: var(--yellow); }
  .seg-opt input:checked + span::before { content: "✓ "; }
  .seg-opt input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 3px; }

  .err { background: var(--pink); color: var(--ink); font-weight: 700; padding: .75rem 1rem; border-radius: 14px; margin-bottom: .75rem; text-align: center; }
  .status { display: flex; align-items: center; justify-content: center; gap: .6rem; }
  .spinner { width: 1.2rem; height: 1.2rem; border: 3px solid var(--muted); border-top-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .code { font-size: 3.2rem; font-weight: 800; letter-spacing: .6rem; color: var(--yellow); direction: ltr; margin: 0; }
  .qr { background: #fff; border-radius: 16px; padding: .5rem; width: 12rem; margin: .5rem auto; }
  .qr svg { width: 100%; height: auto; display: block; }

  /* מחוון שלבים */
  .stepper { list-style: none; display: flex; padding: 0; margin: 0 0 1rem; gap: .25rem; }
  .stepper li { flex: 1; text-align: center; font-size: .85rem; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: .2rem; }
  .stepper .dot { width: 2.2rem; height: 2.2rem; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.35); font-size: 1rem; }
  .stepper .done .dot { background: var(--green); color: var(--ink); border-color: var(--green); font-weight: 800; }
  .stepper .cur { color: #fff; font-weight: 700; }
  .stepper .cur .dot { background: var(--yellow); border-color: #fff; transform: scale(1.12); }

  /* הקלף */
  .cardsec { margin-bottom: .5rem; }
  .card { margin: .25rem auto 0; width: 100%; max-width: 21rem; min-height: 24rem; border-radius: 26px; cursor: pointer; display: flex; }
  .face { flex: 1; border-radius: 26px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.25rem; text-align: center; }
  .face p { margin: .35rem 0; }
  .front { background: repeating-linear-gradient(45deg, var(--blue), var(--blue) 18px, #3ab4dc 18px, #3ab4dc 36px); color: var(--ink); }
  .front .q { font-size: 5.5rem; line-height: 1; }
  .front p { font-size: 1.25rem; font-weight: 700; background: rgba(255,255,255,.9); padding: .4rem 1rem; border-radius: 14px; }
  .card.anim .face { animation: flip .35s ease-out; }
  @keyframes flip { from { transform: perspective(800px) rotateY(80deg); opacity: .3; } to { transform: none; opacity: 1; } }
  .back { background: var(--card); color: var(--ink); }
  .back.imp { background: var(--pink); color: var(--ink); }
  .lbl2 { font-size: 1.05rem; opacity: .85; margin: 0; font-weight: 700; }
  .pic { font-size: 5rem; line-height: 1.1; display: block; }
  .pic.sm { font-size: 3.5rem; }
  .cat .pic, .cat span[role=img] { display: inline; font-size: 1.3em; }
  .word { font-size: 2.6rem; font-weight: 800; line-height: 1.1; margin: .25rem 0 !important; }
  .cat { font-size: 1.05rem; background: rgba(0,0,0,.07); padding: .35rem .9rem; border-radius: 12px; }

  .progress { height: 12px; background: rgba(255,255,255,.15); border-radius: 8px; overflow: hidden; margin: .75rem 0 0; }
  .progress div { height: 100%; background: var(--green); transition: width .3s; }

  .vote-list { display: grid; gap: .6rem; }
  .vote { display: flex; align-items: center; gap: .6rem; width: 100%; min-height: 3.5rem; padding: .5rem 1rem; border-radius: 16px; font: inherit; font-size: 1.15rem; font-weight: 700;
    background: rgba(255,255,255,.12); color: #fff; border: 2px solid rgba(255,255,255,.35); cursor: pointer; text-align: right; }
  .vote .nm { flex: 1; }
  .vote.sel { background: var(--yellow); color: var(--ink); border-color: #fff; }
  .chk { font-size: .9rem; background: var(--ink); color: var(--yellow); padding: .1rem .5rem; border-radius: 8px; }

  .banner { font-size: 1.6rem; font-weight: 800; text-align: center; padding: 1rem; border-radius: 22px; margin: 0 0 1rem; color: var(--ink); }
  .banner.win { background: var(--green); }
  .banner.lose { background: var(--pink); }
  .reveal-word { text-align: center; }
  .word2 { font-size: 2.2rem; font-weight: 800; color: var(--yellow); margin: 0; }
  .impname b { color: var(--pink-text); font-size: 1.3rem; }
  .tally .v { font-weight: 800; }
  .tips { margin: 0; padding-inline-start: 1.4rem; line-height: 1.7; }
  .starter { background: var(--yellow); color: var(--ink); border-radius: 18px; padding: .9rem; text-align: center; font-size: 1.15rem; margin-bottom: 1rem; }
  .starter b { font-size: 1.4rem; }
  .confirm-q { text-align: center; font-weight: 700; margin: .75rem 0 0; }
  .confirm { border: 2px solid var(--pink); }

  details > summary { cursor: pointer; font-size: 1.1rem; font-weight: 700; min-height: var(--tap); display: flex; align-items: center; gap: .4rem; list-style-position: inside; }
  details[open] > summary { margin-bottom: .5rem; }
  .foot { text-align: center; color: var(--muted); font-size: .9rem; margin-top: 1.5rem; }
  .foot details { text-align: right; background: var(--panel); border-radius: var(--r); padding: .5rem 1rem; }
  .foot summary { justify-content: center; font-size: 1rem; }
  .a11y { color: #fff; font-size: .95rem; }
  .a11y ul { padding-inline-start: 1.2rem; }

  /* כיבוד "הפחתת תנועה" (WCAG 2.3.3) */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
  /* מצב ניגודיות גבוהה של מערכת ההפעלה */
  @media (forced-colors: active) {
    .btn, .vote, .seg-opt span, .tool { border: 2px solid ButtonText; }
  }
</style>
</head>
<body>
<a class="skip" href="#app">דילוג לתוכן המשחק</a>
<main id="app" tabindex="-1"><h1>מי המתחזה?</h1><p class="sub">טוען…</p></main>
<div id="live" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<script src="https://unpkg.com/mqtt@5.16.1/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="words.js?v=6"></script>
<script src="game.js?v=6"></script>
</body>
</html>
